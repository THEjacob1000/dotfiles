[tools]
air = "latest"
argocd = "latest"
"asdf:asdf-community/asdf-bitwarden-secrets-manager" = "latest"
aws = { version = "latest", symlink_bins = "true" }
bazelisk = "latest"
biome = "latest"
bun = "latest"
cocoapods = { version = "latest", os = ["macos"] }
direnv = "latest"
doppler = "latest"
duckdb = "latest"
firebase = "latest"
gemini = "latest"
gh = "latest"
go = "latest"
golangci-lint = "latest"
node = "latest"
helm = "latest"
hurl = "latest"
hyperfine = "latest"
java = "latest"
jj = "latest"
jjui = "latest"
just = "latest"
mysql = "latest"
pipx = "latest"
postgres = "latest"
python = "latest"
railway = { version = "latest", exe = "railway" }
ruby = "latest"
sentry = "latest"
sqlite = "latest"
stripe = "latest"
task = "latest"
terraform = "latest"
terraformer = "latest"
usage = "latest"
uv = "latest"
vercel = "latest"
yq = "latest"
"github:rabbitmq/rabbitmqadmin-ng" = "latest"
"http:loke" = { version = "latest", url = 'https://tools-nix-cache.s3.ap-southeast-4.amazonaws.com/downloads/loke-cli/{{ version }}/loke-{{ os(macos="darwin") }}-{{ arch(x64="amd64") }}.tar.gz', version_list_url = "https://tools-nix-cache.s3.ap-southeast-4.amazonaws.com/downloads/loke-cli/latest" }
pnpm = "11"

[settings]
idiomatic_version_file_enable_tools = ["node"]

[settings.node]
gpg_verify = false
