wrappers = { cargo = { command = "mbx", env = { MBX_CARGO_SHIM_MODE = "1" } } }

[tools]
aws = { version = "latest", symlink_bins = "true" }
biome = "latest"
bun = "latest"
cocoapods = { version = "latest", os = ["macos"] }
direnv = "latest"
gh = "latest"
go = "latest"
node = "latest"
hyperfine = "latest"
jj = "latest"
jjui = "latest"
just = "latest"
postgres = "latest"
python = "latest"
ruby = { version = "latest", os = ["macos"] }
uv = "latest"
yq = "latest"
mysql-client = "latest"
mr-boxington = "latest"
# standalone, since a global mise rust would set RUSTUP_TOOLCHAIN and override every project's rust-toolchain.toml
rust-analyzer = "latest"
taplo = "latest"
cargo-binstall = "latest"
"cargo:bacon" = "latest"
cargo-llvm-cov = "latest"
cargo-make = "latest"
cargo-nextest = { version = "latest", version_prefix = "cargo-nextest-" }
cargo-watch = "latest"
cargo-generate = "latest"
cargo-deny = "latest"
neovim = "latest"
"npm:@openai/codex" = "latest"
"npm:@oh-my-pi/pi-coding-agent" = "latest"
claude = "latest"
jq = "latest"
ripgrep = "latest"
tmux = "latest"
xcodegen = { version = "latest", os = ["macos"] }
xcodes = { version = "latest", os = ["macos"] }
"go:golang.org/x/tools/gopls" = "latest"
zoxide = "latest"
fzf = "latest"
fastfetch = "latest"
tealdeer = "latest"
dua = "latest"
usage = "latest"
ffmpeg = "latest"
# Pinned: "latest" moved the bk path mid-session and pruned the old install off PATH.
"aqua:buildkite/cli" = "3.64.2"
loke = { version = "latest", url = 'https://tools.tail8060d.ts.net:8443/downloads/loke-cli/{{ version }}/loke-{{ os(macos="darwin") }}-{{ arch(x64="amd64") }}.tar.gz', version_list_url = "https://tools.tail8060d.ts.net:8443/downloads/loke-cli/latest" }

[tool_alias]
loke = "http:loke"
cargo-nextest = "github:nextest-rs/nextest"
cargo-llvm-cov = "aqua:taiki-e/cargo-llvm-cov"
cargo-watch = "github:watchexec/cargo-watch"
cargo-generate = "github:cargo-generate/cargo-generate"

[settings]
idiomatic_version_file_enable_tools = ["node"]
trusted_config_paths = ["~/Documents/Codex/loke-workspaces"]
experimental = true
# Shims on PATH expose every project's pinned tools in every directory.
activate_shims = false
cargo.binstall_quickinstall = true
npm.package_manager = "bun"
pypi.uvx = true
minimum_release_age_excludes = [
  "npm:@oh-my-pi/pi-coding-agent",
  "npm:@openai/codex",
  "bun",
  "claude",
  "mr-boxington",
]

[settings.node]
gpg_verify = false

[settings.self_update]
auto = true
