##### ─────────────────────────────────────────────────────────────
##### CORE BEHAVIOR
##### ─────────────────────────────────────────────────────────────

set -g prefix C-a                              # Prefix = Ctrl+a
unbind C-b                                     # Remove default Ctrl+b prefix
bind C-a send-prefix                           # Prefix + Ctrl+a = send literal Ctrl+a to the app

set -g mode-keys vi                            # Use vi keys in copy mode
set -g status-keys vi                          # Use vi keys in tmux command/status prompts
set -sg escape-time 10                         # Faster Escape handling; feels better with vim
set -g focus-events on                         # Let apps know when focus changes
set -g history-limit 100000                    # Large scrollback buffer

set -g base-index 1                            # Windows start at 1
setw -g pane-base-index 1                      # Panes start at 1
set -g renumber-windows on                     # Renumber windows automatically after closing

set -g mouse on                                # Enable mouse support while learning
set -g detach-on-destroy off                   # Keep session alive if a pane/window closes

##### ─────────────────────────────────────────────────────────────
##### RELOAD / QUALITY OF LIFE
##### ─────────────────────────────────────────────────────────────

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"   # Prefix + r = reload tmux config
bind q display-panes                           # Prefix + q = show pane numbers briefly
bind z resize-pane -Z                          # Prefix + z = zoom/unzoom current pane
bind Space next-layout                         # Prefix + Space = cycle pane layouts
bind t select-layout tiled                     # Prefix + t = tiled
bind e select-layout even-horizontal           # Prefix + e = even horizontal
bind v select-layout even-vertical             # Prefix + v = even vertical
bind g select-layout main-horizontal           # Prefix + g = main horizontal
bind G select-layout main-vertical             # Prefix + Shift+g = main vertical

##### ─────────────────────────────────────────────────────────────
##### SPLITS
##### ─────────────────────────────────────────────────────────────

unbind '"'
unbind %

bind | split-window -h -c "#{pane_current_path}"   # Prefix + | = split pane left/right
bind - split-window -v -c "#{pane_current_path}"   # Prefix + - = split pane top/bottom

##### ─────────────────────────────────────────────────────────────
##### PANE NAVIGATION
##### ─────────────────────────────────────────────────────────────

bind h select-pane -L                          # Prefix + h = move to left pane
bind j select-pane -D                          # Prefix + j = move to pane below
bind k select-pane -U                          # Prefix + k = move to pane above
bind l select-pane -R                          # Prefix + l = move to right pane

bind -n M-h select-pane -L                     # Alt+h = move to left pane without prefix
bind -n M-j select-pane -D                     # Alt+j = move to pane below without prefix
bind -n M-k select-pane -U                     # Alt+k = move to pane above without prefix
bind -n M-l select-pane -R                     # Alt+l = move to right pane without prefix

##### ─────────────────────────────────────────────────────────────
##### PANE RESIZING
##### ─────────────────────────────────────────────────────────────

bind -r H resize-pane -L 5                     # Prefix + Shift+h = resize pane left
bind -r J resize-pane -D 5                     # Prefix + Shift+j = resize pane downward
bind -r K resize-pane -U 5                     # Prefix + Shift+k = resize pane upward
bind -r L resize-pane -R 5                     # Prefix + Shift+l = resize pane right

##### ─────────────────────────────────────────────────────────────
##### WINDOW NAVIGATION
##### ─────────────────────────────────────────────────────────────

bind p previous-window                         # Prefix + p = previous window
bind n next-window                             # Prefix + n = next window
bind Tab last-window                           # Prefix + Tab = jump to last active window

bind -r < swap-window -t -1                    # Prefix + < = move current window left
bind -r > swap-window -t +1                    # Prefix + > = move current window right

##### ─────────────────────────────────────────────────────────────
##### WINDOW / PANE MANAGEMENT
##### ─────────────────────────────────────────────────────────────

bind c new-window -c "#{pane_current_path}"    # Prefix + c = create new window in current path
bind x kill-pane                               # Prefix + x = kill current pane
bind X kill-window                             # Prefix + Shift+x = kill current window
bind & kill-session                            # Prefix + & = kill current session

##### ─────────────────────────────────────────────────────────────
##### COPY MODE (VIM-LIKE)
##### ─────────────────────────────────────────────────────────────

bind [ copy-mode
bind ] run-shell "xclip -selection clipboard -o | tmux load-buffer - ; tmux paste-buffer"

# Enable OSC 52 so remote tmux sessions can also push to the local clipboard
set -g set-clipboard on

# Selection
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Yank to system clipboard (X11 via xclip)
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-no-clear "xclip -selection clipboard -in"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"

bind -T copy-mode-vi Escape send-keys -X cancel

# Search
bind -T copy-mode-vi / command-prompt -p "search down" "send-keys -X search-forward '%%'"
bind -T copy-mode-vi ? command-prompt -p "search up" "send-keys -X search-backward '%%'"
bind -T copy-mode-vi n send-keys -X search-again
bind -T copy-mode-vi N send-keys -X search-reverse

##### ─────────────────────────────────────────────────────────────
##### SCROLLING
##### ─────────────────────────────────────────────────────────────

bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "copy-mode -e"
bind -n WheelDownPane select-pane \; send-keys -M

##### ─────────────────────────────────────────────────────────────
##### SMARTER PANE BORDER / STATUS
##### ─────────────────────────────────────────────────────────────

set -g status-position bottom
set -g status-left-length 40
set -g status-right-length 80

set -g status-left '#{?client_prefix,#[reverse] PREFIX #[default] #S ,#S }'
set -g status-right "#{?window_zoomed_flag,[ZOOM] ,}#H %Y-%m-%d %H:%M "

setw -g window-status-current-format "#I:#W#F"
setw -g window-status-format "#I:#W#F"

##### ─────────────────────────────────────────────────────────────
##### EASY PANE MARKING / SWAPPING
##### ─────────────────────────────────────────────────────────────

bind m select-pane -m                           # Prefix + m = mark current pane
bind M swap-pane -s '{marked}'                  # Prefix + Shift+m = swap with marked pane

##### ─────────────────────────────────────────────────────────────
##### VI-STYLE CHOICE MENUS
##### ─────────────────────────────────────────────────────────────

setw -g mode-style "bg=yellow,fg=black"
